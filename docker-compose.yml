version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - wordcount-net
  
  #server:
  loadbalancer:
    build: .
    command: python -u loadbalancer/loadbalancer.py
    depends_on: [server1, server2, server3]
    networks: [wordcount-net]
  server1:
    build: .
    command: python -u -m server.server
    volumes: ["./SampleTexts:/app/SampleTexts"]
    depends_on: [redis]
    networks: [wordcount-net]
  client:
    build: .
    command: python -u client/client.py
    environment:
      SERVER_HOST: server1
      SERVER_PORT: "18861"
    volumes: ["./SampleTexts:/app/SampleTexts"]
    depends_on: [server1]
    networks: [wordcount-net]
networks:
  wordcount-net:
    driver: bridge